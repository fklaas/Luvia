  <script data-luvia-critical="place-contract-bootstrap">
  (function(){
    'use strict';
    if(window.LuviaPlaceTypeContracts&&typeof window.LuviaPlaceTypeContracts.register==='function')return;
    const contracts=new Map();
    const clone=value=>{try{return JSON.parse(JSON.stringify(value))}catch{return value}};
    const api={
      version:'bootstrap-4.28.4',bootstrap:true,
      register(contract){
        if(!contract||!contract.type)throw new Error('Ungültiger Place Type Contract: type fehlt.');
        const normalized=Object.freeze({...clone(contract),contractVersion:'bootstrap-4.28.4'});
        contracts.set(normalized.type,normalized);
        window.dispatchEvent(new CustomEvent('luvia:place-contract-registered',{detail:{type:normalized.type,bootstrap:true}}));
        return normalized;
      },
      get:type=>contracts.get(type)||null,
      all:()=>[...contracts.values()],
      field:(type,key)=>contracts.get(type)?.fields?.find(field=>field.key===key)||null,
      dateFields:type=>(contracts.get(type)?.fields||[]).filter(field=>['date','time','datetime'].includes(field.type)),
      timelineFields:type=>(contracts.get(type)?.fields||[]).filter(field=>['start','end','point'].includes(field.timelineRole)),
      capability:(type,key)=>Boolean(contracts.get(type)?.capabilities?.[key]),
      validate:contract=>({valid:Boolean(contract?.type),errors:contract?.type?[]:['type fehlt'],warnings:['Bootstrap-Validierung aktiv.']}),
      diagnostics:()=>({version:'bootstrap-4.28.4',status:'degraded-ready',bootstrap:true,registered:contracts.size,types:[...contracts.keys()]})
    };
    window.LuviaPlaceTypeContracts=api;
    window.dispatchEvent(new CustomEvent('luvia:place-contract-ready',{detail:{version:api.version,bootstrap:true}}));
  })();
  </script>
